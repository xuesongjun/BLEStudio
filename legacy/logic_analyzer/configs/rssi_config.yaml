# RSSI 数据解析配置文件
# ==========================================

# 输入输出文件
input_file: "template_data/rssi.bin"
output_file: "template_data/rssi_wave"

# 采样参数
sample_rate: 100e6    # SDR 采样率 (Hz)
data_rate: 100e6      # 数据速率 (Hz)，与采样率相同表示每个采样点一个数据

# 数据格式
mode: sdr             # SDR 模式
data_bits: [0, 1, 2, 3, 4, 5, 6, 7]  # RSSI bit0~bit7
bit_width: 8          # RSSI 数据位宽

# 额外信号通道
extra_signals:
  agc_init: 8         # bit8: agc_init
  rampup: 9           # bit9: rampup
  fire_timer: 10      # bit10: fire_timer

# 处理选项
eye_align: false      # SDR 模式不需要眼图对齐
glitch_filter: false  # 不需要去毛刺

# 输出选项
plot: true
save_formats:
  - txt
  - html
