# BLE Studio - 导入逻辑分析仪恢复的 canonical MAT
#
# 使用: python examples/demo.py examples/config_import_hex.yaml
#
# 数据流: Kingst BIN 恢复结果 → [信道入口] → (bypass) → RX 解调

# 公共参数
common:
  mode: "rf_test"
  channel: 0

# 发送端 (需与文件中的信号参数匹配)
tx:
  phy_mode: "LE_1M"
  sample_rate: 16.0e6  # 实际值会优先从 MAT 的 fs 读取
  modulation_index: 0.5
  bt: 0.5
  payload_type: "PRBS9"
  payload_length: 37
  whitening: false

# 信道模型 (bypass)
channel:
  snr_db: 100
  freq_offset: 0

# 数据导入导出
io:
  input:
    enabled: true
    file: "data/logic_analyzer/fixtures/adc_ddr_iq.mat"
    file_type: "mat"
    mat_complex_var: "iq"
  output:
    enabled: false

# 输出
output:
  dir: "results"
  html_report: true
  html_charts: true
  theme: "instrument"
